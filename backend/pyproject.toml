[project]
name = "taif-backend"
version = "0.1.0"
description = "Domain-agnostic agentic platform — backend core (TAIF S2)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "litellm>=1.52",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

# Feature dependencies are grouped per module. Owning agents verify exact names /
# versions against current docs and report any correction; the orchestrator
# merges corrections here (agents do not edit this file directly).
[project.optional-dependencies]
data = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
]
# Multi-tenant RBAC + governance (§3.3): JWT access tokens + Argon2 password hashing.
auth = [
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]
observability = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "arize-phoenix>=5.0",
    "arize-phoenix-otel>=0.6",
]
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # Durable checkpointer for production HITL (§1.3): a paused ``interrupt``
    # persists to Postgres and resumes from another process / after a restart.
    "langgraph-checkpoint-postgres>=2.0",
]
retrieval = [
    "lightrag-hku>=1.0",
    "neo4j>=5.24",
    "redis>=5.1",
]
ml = [
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "mapie>=1.4",
    "shap>=0.46",
    # Capped <2.4 to co-exist with nemoguardrails (guardrails extra), which pins
    # pandas below 2.4. The ML spine is verified on pandas 2.3.
    "pandas>=2.2,<2.4",
    "numpy>=1.26",
    "joblib>=1.4",
]
# NeMo Guardrails is the declarative Colang policy engine (one policy, two front
# doors — see app/guardrails/rails.py + config/). It is a real, executed enforcement
# path selected by GUARDRAILS_ENGINE=nemo; pulls onnxruntime/HuggingFace and caps
# pandas <2.4 (reflected in the ml extra above).
guardrails = [
    "nemoguardrails>=0.23",
]
# The MCP tool-server facade (app/mcp): exposes the adapter tool registry over a
# real Model Context Protocol stdio server, preserving allowlist/audit/risk gates.
mcp = [
    "mcp>=2.0",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Sensible, strict-ish default set; expand as the codebase grows.
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]  # conflicting docstring rules; pick one each

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the framework idiom in argument
# defaults; they are immutable sentinels, so B008 (function-call-in-default)
# does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
