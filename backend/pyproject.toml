[project]
name = "taif-backend"
version = "0.1.0"
description = "Domain-agnostic agentic platform — backend core (TAIF S2)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "litellm>=1.52",
    "httpx>=0.27",
    # Starlette parses multipart/form-data only when this is installed — without it
    # any `UploadFile` route raises at request time. Required by POST /voice/transcribe
    # (chosen over base64, which inflates a recording ~33% and defeats a streaming
    # size check); a core dependency, not an extra, because the route is always mounted.
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    # The sibling `aegis` package (aegis.core + aegis.guardrails): the legacy
    # guardrail stack delegates to it via a strangler shim (app/guardrails).
    "aegis",
]

[tool.uv.sources]
aegis = { path = "../aegis", editable = true }

# Feature dependencies are grouped per module. Owning agents verify exact names /
# versions against current docs and report any correction; the orchestrator
# merges corrections here (agents do not edit this file directly).
[project.optional-dependencies]
evals-libs = [
    # The real evaluation libraries, opt-in. `aegis.evals` itself never imports them —
    # tests/evals/test_isolation.py asserts that, and it is worth keeping: the core eval
    # library stays offline and dependency-free, and these are a cost only a deployment
    # that wants live metrics pays.
    #
    # langchain-community is pinned below 0.4 because ragas 0.4.3 imports
    # `langchain_community.chat_models.vertexai.ChatVertexAI` at module load, and 0.4.2
    # removed it — the import fails outright, which a version-range check does not catch.
    # That package is also being sunset by its maintainers, so this pin is a
    # known-temporary arrangement rather than a settled one.
    "ragas>=0.4.3,<0.5",
    "langchain-community<0.4",
]
# Embeddings persist as JSON of record; vector ANN search lives in the embedded vector
# store (retrieval extra), so pgvector was removed — Postgres stays for
# relational/KV/governance only.
# No ``alembic``: this project has no migration tree (no ``alembic.ini``, no
# ``versions/``), because the schema is materialised by ``app.data.session.bootstrap``
# via ``metadata.create_all``. Declaring alembic bought an unusable CLI and a heavier
# install; add it back with a real migration tree if create_all is ever outgrown.
data = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]
# Multi-tenant RBAC + governance (§3.3): JWT access tokens + Argon2 password hashing.
auth = [
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]
# Durable orchestration for multi-stage background work (Phase 3). Temporal owns
# *execution* state - retries, timers, stage resumability, cancellation - while the
# tenant-scoped ``job_runs``/``documents`` tables stay the system of record, so RLS
# still protects every row a tenant can see. Chosen over procrastinate/pgqueuer/DBOS/
# SAQ because none of them carries a ``tenant_id``: ``rls.py`` skips a table with no
# tenant column *before* recording a gap, so their tables would be invisible to the
# very diagnostic built to catch ungoverned tables.
#
# Floor at 1.18: ``WorkflowEnvironment.start_time_skipping`` and the sandbox
# restrictions the workflow code relies on are stable from there. Capped <2 so a major
# release cannot land unreviewed - the SDK's sandbox semantics are load-bearing here.
jobs = [
    "temporalio>=1.18,<2",
]
observability = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    # Capped <15: arize-phoenix 15+ (and especially the 20.x line) fails to import on
    # Python 3.11 — the 14.x line is the verified-good one for this stack. Without the
    # cap a clean rebuild resolves 20.x and the whole app dies at import time.
    "arize-phoenix>=14.6,<15",
    "arize-phoenix-otel>=0.6",
]
agent = [
    # Bounded deliberately: this project runs 1.2.x. LangGraph went 0.2 -> 1.x
    # while the pin said ">=0.2", so an unbounded resolve could silently pull a
    # major with different interrupt/state semantics on a fresh machine.
    "langgraph>=1.2,<2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # Durable checkpointer for production HITL (§1.3): a paused ``interrupt``
    # persists to Postgres and resumes from another process / after a restart.
    "langgraph-checkpoint-postgres>=3.1,<4",
]
retrieval = [
    "lightrag-hku>=1.0",
    "neo4j>=5.24",
    "redis>=5.1",
    # Qdrant is THE vector DB, and the ONLY one (§9.1): `aegis.retrieval` and LightRAG's
    # `QdrantVectorDBStorage` share one node via `QDRANT_URL`. Qdrant v1.19.0 ships
    # `qdrant-x86_64-pc-windows-msvc.zip` — Apache-2.0, a zip with a binary, no Docker and
    # no installer — so a locked-down enterprise machine still runs it, and a second
    # uvicorn worker can finally share the index. `qdrant_client` keeps an in-process mode
    # for tests and dev.
    "qdrant-client>=1.12",
]
# PDF ingestion (app.ingestion -> aegis.ingestion). The version is pinned in the aegis
# package, where the code that depends on its exact behaviour lives; the backend declares
# the extra so a deployment that ingests gets it, and one that does not is not asked to
# download 816 MB of torch and opencv it will never import.
ingestion = [
    "aegis[ingestion]",
]
ml = [
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "mapie>=1.4",
    "shap>=0.46",
    # Capped <2.4 to co-exist with nemoguardrails (guardrails extra), which pins
    # pandas below 2.4. The ML spine is verified on pandas 2.3.
    "pandas>=2.2,<2.4",
    # Capped <2.5 for two independent reasons: presidio-analyzer 2.2.364 (guardrails
    # extra) declares ``numpy<2.5``, and numba/llvmlite (a shap dependency) have no
    # release supporting numpy 2.5 — without the cap the resolver drags numba back to
    # an ancient release. The ML spine is verified on numpy 2.4.x.
    "numpy>=1.26,<2.5",
    "joblib>=1.4",
]
# Time-series forecasting (app.forecast → aegis.forecast). Nixtla statsforecast gives
# AutoARIMA / AutoETS / SeasonalNaive plus ``ConformalIntervals``, the calibrated,
# distribution-free band the /forecast surface reports measured coverage for. It resolves
# against the pins already held above and by [tool.uv] (numba==0.67.0, numpy<2.5,
# pandas<2.4) and runs on CPU — no GPU, no extra system libraries.
forecast = [
    "aegis[forecast]",
    "statsforecast>=2.1,<3",
]
# NeMo Guardrails is the declarative Colang policy engine (one policy, two front
# doors — see app/guardrails/rails.py + config/). It is a real, executed enforcement
# path selected by GUARDRAILS_ENGINE=nemo; pulls onnxruntime/HuggingFace and caps
# pandas <2.4 (reflected in the ml extra above).
guardrails = [
    "nemoguardrails>=0.23",
    # Presidio + spaCy back the PII layer that ``aegis.guardrails.pii`` delegates to
    # (regex fallback when absent). The backend's redaction tests assert real NER
    # entity kinds (PERSON), so the host must declare the extra it actually depends on
    # — otherwise a clean rebuild silently ships the degraded regex-only engine.
    # Runtime model: ``python -m spacy download en_core_web_sm`` (not a PyPI dep).
    "aegis[pii]",
]
# Web search for the research sub-agent (phase-05 §5.6). The provider client is pinned
# in the aegis package, where the seam that wraps it lives; the backend declares the
# extra so a deployment that wants live external evidence gets it. Without it — or
# without a ``TAVILY_API_KEY`` — the research path degrades to the internal corpus and
# reports the degradation; it does not fail and it does not pretend.
websearch = [
    "aegis[websearch]",
]
# The MCP server (app/mcp): exposes the adapter tool registry and Aegis's own
# tenant-scoped reads over a real Model Context Protocol **Streamable HTTP** server,
# mounted at ``/mcp`` — preserving allowlist/audit/risk gates and enforcing the
# platform's RBAC and tenant scope per call (§10.4/10.5).
# The code targets the 2.x API (``FastMCP`` handlers); 1.x is NOT compatible, hence
# the floor, and <3 guards against an unreviewed next major.
mcp = [
    "mcp>=2.0,<3",
]
# No ``aiosqlite``: the suite runs against a real PostgreSQL and nothing else. SQLite
# silently degraded the very things these tests exist to prove — it ignores foreign keys
# unless ``PRAGMA foreign_keys=ON``, renders native enums as VARCHAR and JSONB as JSON,
# and has no roles at all, so ``aegis.governance.rls.set_tenant_scope`` was a no-op and
# every "tenant isolation" assertion passed with the policies dropped. ``tests/pgsupport.py``
# provisions a uuid-named scratch database and a ``NOSUPERUSER NOBYPASSRLS`` role per run;
# ``asyncpg`` (the ``data`` extra) is the only driver the tests need.
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "greenlet>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Sensible, strict-ish default set; expand as the codebase grows.
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]  # conflicting docstring rules; pick one each

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the framework idiom in argument
# defaults; they are immutable sentinels, so B008 (function-call-in-default)
# does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
# Resolution constraints (NOT extra dependencies — these only bound versions of
# packages already in the graph). They pin the three points where a free resolve
# drifts away from the verified-good stack captured in ``uv.lock``:
#   litellm            1.96.2 regressed the gateway path; 1.96.0 is the verified one.
#   presidio-analyzer  a free resolve picks the older 2.2.362 (it back-solves around
#                      pydantic/numpy); 2.2.364 is the version the PII layer is tested on.
#   numba              a shap transitive; unconstrained the resolver falls back to an
#                      ancient 0.4x release that cannot build against numpy 2.4.
constraint-dependencies = [
    "litellm==1.96.0",
    "presidio-analyzer==2.2.364",
    "numba==0.67.0",
]
