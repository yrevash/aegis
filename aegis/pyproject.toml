[project]
name = "aegis"
version = "0.1.0"
description = "Aegis — modular, importable agentic-AI platform components."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "ag-ui-protocol~=0.1.19"]

[project.optional-dependencies]
redis = ["redis>=5.1"]
nemo = ["nemoguardrails>=0.23"]
# Industry-standard PII detection/redaction (Microsoft Presidio + spaCy NER). The
# public ``aegis.guardrails.pii`` API falls back to a pure-code regex engine when
# these are absent, so this extra is optional. Needs the ``en_core_web_sm`` spaCy
# model at runtime: ``python -m spacy download en_core_web_sm``.
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
retrieval = [
    "lightrag-hku>=1.0",
    "neo4j>=5.24",
    "redis>=5.1",
    # Qdrant is the vector store for retrieval (replaces pgvector). Postgres stays for
    # LightRAG's KV + doc-status stores, hence asyncpg — but not pgvector.
    "qdrant-client>=1.12",
    "asyncpg>=0.29",
]
gateway = ["litellm>=1.52"]
data = ["sqlalchemy[asyncio]>=2.0", "pgvector>=0.3"]
governance = [
    "sqlalchemy[asyncio]>=2.0",
    "pgvector>=0.3",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]
observability = ["opentelemetry-sdk>=1.27", "opentelemetry-api>=1.27"]
phoenix = ["arize-phoenix>=5.0", "arize-phoenix-otel>=0.6"]
# The LangGraph orchestration core. The durable Postgres checkpointer
# (``langgraph-checkpoint-postgres``) stays a host/backend concern, injected via
# the composition root; ``aegis.agent`` needs only the in-memory saver + the
# observability span helpers (a real, cheap dependency it imports directly).
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]
ml = [
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "mapie>=1.4",
    "shap>=0.46",
    # Capped <2.4 to co-exist with nemoguardrails, which pins pandas below 2.4.
    "pandas>=2.2,<2.4",
    "numpy>=1.26",
    "joblib>=1.4",
]
all = ["aegis[redis,nemo,pii,postgres,retrieval,ml,gateway,data,governance,observability,phoenix,agent]"]
dev = ["ruff>=0.7", "pytest>=8.3", "pytest-asyncio>=0.24", "aiosqlite>=0.20"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]
