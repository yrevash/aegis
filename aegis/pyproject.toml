[project]
name = "aegis"
version = "0.1.0"
description = "Aegis — modular, importable agentic-AI platform components."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "ag-ui-protocol~=0.1.19"]

[project.optional-dependencies]
# ``redisvl`` brings the industry-standard semantic cache (RediSearch vector index) used by
# aegis.memory.cache.MemorySemanticCache; ``redis`` is its async client. Both are optional —
# offline the memory cache uses an explicit, labeled in-memory fallback (never RedisVL faked).
redis = ["redis>=5.1", "redisvl>=0.25"]
nemo = ["nemoguardrails>=0.23"]
# Industry-standard PII *detection* (Microsoft Presidio analyzer + spaCy NER). The
# public ``aegis.guardrails.pii`` API falls back to a pure-code regex engine when
# these are absent, so this extra is optional. Needs the ``en_core_web_sm`` spaCy
# model at runtime: ``python -m spacy download en_core_web_sm``.
#
# Detection only — ``presidio-anonymizer`` is deliberately NOT here. Redaction is done
# by this package itself (``_pii_presidio._placeholder`` substitutes the legacy
# ``[REDACTED_<KIND>]`` tokens over the analyzer's spans), so the anonymizer was a
# declared-but-never-imported dependency.
pii = ["presidio-analyzer>=2.2", "spacy>=3.7"]
# Postgres stays for relational/KV/doc-status/governance; the pgvector extension is gone
# (vector search moved to the embedded vector store), so only asyncpg is needed here.
postgres = ["asyncpg>=0.29"]
retrieval = [
    "lightrag-hku>=1.0",
    "neo4j>=5.24",
    "redis>=5.1",
    # The local ONNX cross-encoder reranker (`aegis.retrieval.local_reranker`). Pinned
    # exactly, for the same reason Docling is: a reranker release can change tokenisation
    # or the exported graph, and a different score ordering is a different answer set -
    # a floating pin would silently re-order retrieval after any rebuild.
    #
    # `fastembed`, NOT `fastembed-gpu`: checked against the resolver before committing to
    # the name. `fastembed==0.8.0` resolves to huggingface-hub, loguru, mmh3, numpy,
    # onnxruntime (the CPU build), pillow, py-rust-stemmers, requests, tokenizers, tqdm -
    # ten wheels and NO torch. `fastembed-gpu` is the one that pulls onnxruntime-gpu, and
    # the deploy box has no GPU. The reranker asks for `CPUExecutionProvider` explicitly
    # anyway, so an onnxruntime-gpu that arrived some other way cannot silently take over.
    "fastembed==0.8.0",
    # Qdrant is THE vector store, and the ONLY one (§9.1): both `aegis.retrieval` and
    # LightRAG's `QdrantVectorDBStorage` write to one node, reached through `QDRANT_URL`.
    # Chroma was deleted rather than demoted — its embedded `PersistentClient` holds a
    # SQLite metadata lock, which is what makes `uvicorn --workers 2` fail, and a ceiling
    # you can still configure your way back into is not removed. `qdrant_client` also
    # provides a real in-process mode, so tests and dev still need no server at all.
    "qdrant-client>=1.12",
    # Postgres stays for LightRAG's KV + doc-status stores, hence asyncpg.
    "asyncpg>=0.29",
]
# The PDF ingestion stack (aegis.ingestion). Docling's STANDARD pipeline - layout model
# plus TableFormer - not its VLM pipeline: measured on a 16 GB M3, the VLM is 255x slower
# per page (281 s vs 1.10 s), which is the whole argument (phase-04 D1). It pulls torch,
# transformers and opencv, hence an extra rather than a core dependency: +816 MB in the
# venv and 730 MB of model weights on disk, measured.
#
# `[rapidocr]` because OCR must be a NAMED engine. Docling's default `OcrAutoOptions`
# resolves to whichever engine happens to be installed, so the same document could be
# read by different models on the laptop and on the demo box with no log line saying so;
# `aegis.ingestion.convert` asks for RapidOCR explicitly and this extra is what makes
# that resolvable. NOT `docling[models-onnxruntime]`, which installs onnxruntime-GPU on
# Windows.
#
# Pinned exactly, unlike every other extra here. A parser release moves reading order,
# heading levels and table structure, so two Docling versions produce two different
# corpora from the same PDF - and the chunks already embedded under the old one are not
# interchangeable with the new one. A floating pin would silently re-index differently
# after any rebuild; `ParsedDocument.parser` records which version produced a document.
ingestion = ["docling[rapidocr]==2.120.3"]
gateway = ["litellm>=1.52"]
# Web search for the research sub-agent (`aegis.websearch`). Optional on purpose: a
# box with no key degrades to internal-only evidence and SAYS SO (ERROR log + a
# `web_search` event), rather than returning an empty result set that looks like a
# clean search. `tavily-python` is imported lazily through `aegis.core.require`, so
# nothing here is paid for until a search actually runs.
websearch = ["tavily-python>=0.5"]
# Embeddings persist as JSON of record (list[float]); ANN search runs in the embedded
# vector store, so the data layer needs only SQLAlchemy — pgvector was removed.
data = ["sqlalchemy[asyncio]>=2.0"]
governance = [
    "sqlalchemy[asyncio]>=2.0",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]
observability = ["opentelemetry-sdk>=1.27", "opentelemetry-api>=1.27"]
phoenix = ["arize-phoenix>=5.0", "arize-phoenix-otel>=0.6"]
# Reference documentation. `pdoc` reads the Google-style docstrings that
# `[tool.ruff.lint] select = [..., "D"]` + `convention = "google"` already enforce,
# so the reference is derived from the source rather than written beside it and left
# to rot. Output goes to `docs/api/` and is git-ignored — see scripts/build_api_docs.py.
# Deliberately NOT folded into `dev`: build_api_docs.py already exits with the exact
# install command when pdoc is absent, so a dev who never builds docs never pays for it.
docs = ["pdoc>=16"]
# The LangGraph orchestration core. The durable Postgres checkpointer
# (``langgraph-checkpoint-postgres``) stays a host/backend concern, injected via
# the composition root; ``aegis.agent`` needs only the in-memory saver + the
# observability span helpers (a real, cheap dependency it imports directly).
agent = [
    # Bounded deliberately: this project runs 1.2.x. LangGraph went 0.2 -> 1.x
    # while the pin said ">=0.2", so an unbounded resolve could silently pull a
    # major with different interrupt/state semantics on a fresh machine.
    "langgraph>=1.2,<2",
    "langchain-core>=0.3",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]
ml = [
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "mapie>=1.4",
    "shap>=0.46",
    # Capped <2.4 to co-exist with nemoguardrails, which pins pandas below 2.4.
    "pandas>=2.2,<2.4",
    "numpy>=1.26",
    "joblib>=1.4",
]
# Time-series forecasting (aegis.forecast). Nixtla statsforecast brings AutoARIMA /
# AutoETS / SeasonalNaive plus ``ConformalIntervals`` — the calibrated, distribution-free
# band this module reports coverage for. It resolves against the pins already held by the
# ``ml`` extra (numba, numpy<2.5, pandas<2.4) and runs on CPU; no GPU is involved.
forecast = [
    "statsforecast>=2.1,<3",
    "pandas>=2.2,<2.4",
    "numpy>=1.26",
]
# Image guardrails: OCR-driven PII detection and pixel-level redaction. Four
# `require("aegis[media]", ...)` call sites in `aegis.guardrails.media` name this
# extra in their fail-closed remedy message, and it did not exist — so a user who
# hit the (correct) refusal was told to run an install that could not resolve.
#
# presidio-image-redactor pulls Tesseract bindings and OpenCV, and the `tesseract`
# BINARY is a separate OS-level install it cannot bring with it; the rail reports
# itself as `not_run` rather than pretending when that is absent.
media = [
    "presidio-image-redactor>=0.0.53",
    "pillow>=10.0",
]
all = ["aegis[redis,nemo,pii,postgres,retrieval,ingestion,ml,forecast,media,gateway,websearch,data,governance,observability,phoenix,agent]"]
# `aegis[postgres]` (asyncpg) is a hard requirement of the test suite, not an optional
# extra of it: every database-backed test runs against a real cluster over a
# `NOSUPERUSER NOBYPASSRLS` role, because the RLS policies this package installs are
# enforced against nobody else. `aiosqlite` used to be here; it is gone deliberately.
# SQLite does not enforce foreign keys without a per-connection PRAGMA and has no row
# security at all, so a suite running on it reported tenant-isolation and
# spend-attribution guarantees that were never actually being checked.
dev = ["aegis[postgres]", "ruff>=0.7", "pytest>=8.3", "pytest-asyncio>=0.24"]
# The executable conformance suite (`pytest --pyargs aegis.conformance`) — the one
# command an integrator runs to prove they wired their adapter correctly. It ships
# inside the package rather than beside it, so it is installable and runnable from a
# wheel with nothing copied. Only pytest: every check is synchronous and touches no
# database, queue or gateway, deliberately — it is run BEFORE any of those work, which
# is when a wiring mistake is cheapest to fix. `aegis[agent]` is a genuine prerequisite
# of the roster check (it reads the graph's dispatch table) and is not duplicated here,
# because an integration with no agent has no roster to check.
conformance = ["pytest>=8.3"]

# The conformance suite is distributed as a pytest plugin, so `--aegis-adapter` exists
# in any environment where aegis is installed and an integrator adds nothing to their
# own conftest.py. The plugin is loaded by every pytest run in that environment and is
# deliberately inert: one namespaced option and one header line, and nothing at all
# happens unless the conformance checks are collected.
[project.entry-points.pytest11]
aegis_conformance = "aegis.conformance.plugin"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]
# ``src/aegis/py.typed`` is the PEP 561 marker: without it every annotation in this
# package is invisible to an integrator's type checker, however complete it is.
# Hatchling ships every non-ignored file under ``packages``, so no extra include is
# needed — verified, not assumed, by building the wheel and the sdist and reading
# their manifests (`aegis/py.typed` and `src/aegis/py.typed` respectively).
# ``tests/core/test_documented_public_surface.py`` asserts the marker is still there.
